<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173B2D">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <title>Piantee — Area riservata</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script src="/admin.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#admin-content">Vai ai contenuti</a>
  <header class="site-header">
    <div class="container brand-row">
      <a class="brand" href="/" aria-label="Piantee, catalogo pubblico">
        <img src="/favicon.svg" width="44" height="44" alt="">
        <span>Piantee</span>
      </a>
      <nav aria-label="Navigazione">
        <a href="/">Catalogo</a>
      </nav>
    </div>
  </header>
  <main id="admin-content" class="container admin-shell">
    <p class="eyebrow">Area privata</p>
    <h1>Gestionale Piantee</h1>
    <p id="auth-status" class="admin-status" role="status" aria-live="polite">Verifica accesso…</p>
    <section id="admin-guest" hidden aria-label="Accedi">
      <p>Questa area è riservata all'unico amministratore.</p>
      <a class="button button-primary" href="/api/auth/login">Accedi con Kinde</a>
    </section>
    <section id="admin-owner" hidden aria-label="Inventario privato">
      <div class="admin-actions">
        <button type="button" id="show-specimens" class="button button-primary">Le mie piante</button>
        <button type="button" id="show-taxa" class="button button-secondary">Specie e cultivar</button>
        <button type="button" id="show-lots" class="button button-secondary">Lotti di semina</button>
        <button type="button" id="logout" class="button button-secondary">Esci</button>
      </div>
      <section class="admin-create" aria-labelledby="admin-create-title">
        <h2 id="admin-create-title">Aggiungi</h2>
        <div class="admin-forms">
          <form id="taxon-create" class="admin-form" autocomplete="off">
            <h3>Specie o gruppo botanico</h3>
            <label for="new-taxon-name">Nome comune</label>
            <input id="new-taxon-name" name="name" maxlength="120" required placeholder="Es. Avocado">
            <label for="new-taxon-scientific">Nome scientifico (facoltativo)</label>
            <input id="new-taxon-scientific" name="scientific_name" maxlength="180">
            <label for="new-taxon-category">Categoria (facoltativa)</label>
            <input id="new-taxon-category" name="category" maxlength="120" placeholder="Es. Fruttifere">
            <button class="button button-primary" type="submit">Salva specie</button>
          </form>
          <form id="cultivar-create" class="admin-form" autocomplete="off">
            <h3>Cultivar</h3>
            <label for="new-cultivar-taxon">Specie di appartenenza</label>
            <select id="new-cultivar-taxon" name="taxon_id" required>
              <option value="">Seleziona specie</option>
            </select>
            <label for="new-cultivar-name">Nome cultivar</label>
            <input id="new-cultivar-name" name="name" maxlength="120" required placeholder="Es. Bacon">
            <button class="button button-primary" type="submit">Salva cultivar</button>
          </form>
          <form id="lot-create" class="admin-form" autocomplete="off">
            <h3>Nuovo lotto di semina</h3>
            <label for="new-lot-taxon">Specie del lotto</label>
            <select id="new-lot-taxon" name="taxon_id" required>
              <option value="">Seleziona specie</option>
            </select>
            <label for="new-lot-label">Identificazione lotto</label>
            <input id="new-lot-label" name="label" maxlength="120" required placeholder="Es. Semi raccolta 2026">
            <label for="new-lot-sown">Data semina (facoltativa)</label>
            <input id="new-lot-sown" name="sown_on" type="date">
            <label for="new-lot-source">Provenienza privata (facoltativa)</label>
            <textarea id="new-lot-source" name="source_details" rows="2" maxlength="2000"></textarea>
            <label for="new-lot-cultivar">Cultivar del frutto sorgente (solo descrittiva)</label>
            <input id="new-lot-cultivar" name="source_cultivar_label" maxlength="200">
            <label for="new-lot-notes">Note interne lotto</label>
            <textarea id="new-lot-notes" name="private_notes" rows="2" maxlength="10000"></textarea>
            <button class="button button-primary" type="submit">Salva lotto</button>
          </form>
          <form id="specimen-create" class="admin-form" autocomplete="off">
            <h3>Pianta</h3>
            <label for="new-specimen-taxon">Specie</label>
            <select id="new-specimen-taxon" name="taxon_id" required>
              <option value="">Seleziona specie</option>
            </select>
            <label for="new-specimen-cultivar">Cultivar (facoltativa)</label>
            <select id="new-specimen-cultivar" name="cultivar_id">
              <option value="">Non specificata / pianta da seme</option>
            </select>
            <label for="new-specimen-lot">Lotto di semina (facoltativo)</label>
            <select id="new-specimen-lot" name="seed_lot_id">
              <option value="">Nessun lotto associato</option>
            </select>
            <label for="new-specimen-label">Etichetta (facoltativa)</label>
            <input id="new-specimen-label" name="display_label" maxlength="180" placeholder="Es. Avocado vaso 60 L">
            <label for="new-specimen-location">Posizione privata (facoltativa)</label>
            <input id="new-specimen-location" name="private_location" maxlength="500">
            <label for="new-specimen-notes">Note interne (facoltative)</label>
            <textarea id="new-specimen-notes" name="internal_notes" maxlength="10000" rows="3"></textarea>
            <button class="button button-primary" type="submit">Salva pianta</button>
          </form>
        </div>
        <p id="admin-write-status" role="status" aria-live="polite" class="admin-status"></p>
      </section>
      <h2 id="admin-list-title">Le mie piante</h2>
      <p id="admin-list-status" role="status" aria-live="polite"></p>
      <ul id="admin-list" class="admin-list"></ul>
      <button type="button" id="load-more" class="button button-secondary" hidden>Carica altre</button>
      <section id="admin-detail" class="admin-detail" hidden aria-labelledby="admin-detail-title">
        <h2 id="admin-detail-title">Dettaglio</h2>
        <dl id="admin-detail-fields"></dl>
        <button type="button" id="close-detail" class="button button-secondary">Chiudi dettaglio</button>
      </section>

    </section>
  </main>
</body>
</html>
