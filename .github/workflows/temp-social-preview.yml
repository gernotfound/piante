name: Temporary regenerate social preview asset

on:
  push:
    branches: [fix/social-preview-original-avocado-piantee]
    paths:
      - .github/workflows/temp-social-preview.yml

permissions:
  contents: write

jobs:
  rasterize:
    if: github.repository == 'gernotfound/piante' && github.ref == 'refs/heads/fix/social-preview-original-avocado-piantee'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Rasterizza l'icona SVG originale e il testo
        run: |
          python -m pip install --disable-pip-version-check --no-input pillow==11.3.0 CairoSVG==2.8.2
          python scripts/refresh-social-preview.py
          test -s social-preview-v1.png
      - name: Registra esclusivamente il PNG sul branch di lavoro
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/social-preview-original-avocado-piantee"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- social-preview-v1.png
          git diff --cached --quiet && { echo "::error::Nessuna variazione nel PNG"; exit 1; }
          git commit -m "asset: aggiorna anteprima social con icona originale Piantee"
          git push origin HEAD:refs/heads/fix/social-preview-original-avocado-piantee
