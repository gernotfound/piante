name: Verifica codice

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configura Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Verifica sintassi
        run: npm run check
      - name: Test unitari
        run: npm test

  firestore-rules:
    name: Firestore Rules emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configura Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Configura Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Installa dipendenze
        run: npm install --no-audit --no-fund
      - name: Verifica Security Rules
        run: npm run test:rules

  codeql:
    name: Security / CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout candidato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Inizializza CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analizza il codice
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          category: "/language:javascript-typescript"

  canonical:
    name: Canonical Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [check, firestore-rules, codeql]
    steps:
      - name: Richiedi controlli e analisi di sicurezza riusciti
        shell: bash
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          RULES_RESULT: ${{ needs.firestore-rules.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          set -euo pipefail
          echo "Sintassi e unit test: ${CHECK_RESULT}"
          echo "Firestore Rules:      ${RULES_RESULT}"
          echo "CodeQL:               ${CODEQL_RESULT}"
          if [[ "${CHECK_RESULT}" != "success" || "${RULES_RESULT}" != "success" || "${CODEQL_RESULT}" != "success" ]]; then
            echo "::error::Almeno un controllo richiesto non è riuscito: nessuna release è consentita."
            exit 1
          fi
