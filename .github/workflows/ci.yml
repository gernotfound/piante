name: Verifica codice
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Static and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configura Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.0'
      - name: Verifica sintassi
        run: npm run check
      - name: Genera asset pubblici Cloudflare
        run: npm run build
      - name: Test unitari e contratti
        run: npm test
  browser-e2e:
    name: Browser E2E (isolated)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configura Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.0'
      - name: Installa dipendenze
        run: npm install --no-audit --no-fund
      - name: Verifica Chrome preinstallato
        run: |
          test -x /opt/google/chrome/chrome
          /opt/google/chrome/chrome --version
      - name: Browser senza dati o credenziali di produzione
        env:
          PIANTE_CHROME_CHANNEL: chrome
        run: npm run test:browser
  cloudflare-native:
    name: Cloudflare Worker and D1 (local workerd)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configura Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.0'
      - name: Installa runtime workerd isolato
        run: npm install --no-save --package-lock=false --no-audit --no-fund miniflare@4.20260730.0
      - name: Verifica migration D1 e Worker
        run: node --test tests/native/cloudflare-runtime.test.js
  cloudflare-package:
    name: Cloudflare cf and Static Assets packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configura Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.0'
      - name: Installa toolchain senza credenziali
        run: npm install --no-audit --no-fund
      - name: Costruisci e verifica il pacchetto Cloudflare
        run: |
          set -euo pipefail
          npm run build:cloudflare:cf
          test -d .cloudflare/output/v0
  codeql:
    name: Security / CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout candidato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Inizializza CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analizza codice
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: "/language:javascript-typescript"
  canonical:
    name: Canonical Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [check, browser-e2e, cloudflare-native, cloudflare-package, codeql]
    steps:
      - name: Richiedi tutti i controlli riusciti
        shell: bash
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          BROWSER_RESULT: ${{ needs.browser-e2e.result }}
          NATIVE_RESULT: ${{ needs.cloudflare-native.result }}
          PACKAGE_RESULT: ${{ needs.cloudflare-package.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          set -euo pipefail
          for value in "$CHECK_RESULT" "$BROWSER_RESULT" "$NATIVE_RESULT" "$PACKAGE_RESULT" "$CODEQL_RESULT"; do
            if [[ "$value" != "success" ]]; then
              echo "::error::Verifica obbligatoria non superata: $value"
              exit 1
            fi
          done
