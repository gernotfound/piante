name: Verifica codice

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configura Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.12.0'
      - name: Verifica sintassi
        run: npm run check
      - name: Costruisci gli asset pubblici
        run: npm run build
      - name: Test unitari
        run: npm test

  firestore-rules:
    name: Firestore Rules emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configura Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.12.0'
      - name: Configura Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Installa dipendenze
        run: npm install --no-audit --no-fund
      - name: Verifica Security Rules
        run: npm run test:rules

  browser-e2e:
    name: Browser E2E (isolated emulators)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout candidato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configura Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.12.0'
      - name: Configura Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Installa dipendenze
        run: npm install --no-audit --no-fund
      - name: Verifica Chrome preinstallato nel runner
        run: |
          set -euo pipefail
          test -x /opt/google/chrome/chrome
          /opt/google/chrome/chrome --version
      - name: Verifica interfaccia e flussi reali sul browser isolato
        env:
          PIANTE_CHROME_CHANNEL: chrome
        run: npm run test:browser

  cloudflare-native:
    name: Cloudflare Worker and D1 (local workerd)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configura Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.12.0'
      - name: Installa il simulatore Workers isolato
        run: npm install --no-save --package-lock=false --no-audit --no-fund miniflare@4.20260730.0
      - name: Esegui la migration D1 e il Worker nel runtime workerd locale
        run: node --test tests/native/cloudflare-runtime.test.js

  codeql:
    name: Security / CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout candidato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Inizializza CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analizza il codice
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:javascript-typescript"

  canonical:
    name: Canonical Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [check, firestore-rules, browser-e2e, cloudflare-native, codeql]
    steps:
      - name: Richiedi controlli e analisi di sicurezza riusciti
        shell: bash
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          RULES_RESULT: ${{ needs.firestore-rules.result }}
          BROWSER_RESULT: ${{ needs.browser-e2e.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          NATIVE_RESULT: ${{ needs.cloudflare-native.result }}
        run: |
          set -euo pipefail
          echo "Sintassi e unit test: ${CHECK_RESULT}"
          echo "Firestore Rules:      ${RULES_RESULT}"
          echo "Browser E2E:          ${BROWSER_RESULT}"
          echo "CodeQL:               ${CODEQL_RESULT}"
          echo "Cloudflare native:    ${NATIVE_RESULT}"
          if [[ "${CHECK_RESULT}" != "success" || "${RULES_RESULT}" != "success" || "${BROWSER_RESULT}" != "success" || "${CODEQL_RESULT}" != "success" || "${NATIVE_RESULT}" != "success" ]]; then
            echo "::error::Almeno un controllo richiesto non è riuscito: nessuna release è consentita."
            exit 1
          fi
