name: Check live Firebase Hosting (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosting-preflight:
    name: Public Hosting readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify checked-out main commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Read public Hosting endpoints only
        run: npm run check:hosting
