name: Deploy in produzione su piantee.web.app

# Il workflow Firestore verificato deve riuscire prima di pubblicare Hosting.
# Nessuna anteprima PR, rilascio manuale o commit superato.
on:
  workflow_run:
    workflows: [Piante Firestore Rules Production]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: hosting-production-piantee
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Hosting verificato
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://piantee.web.app
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout del commit verificato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Rifiuta un commit superato dal branch main
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          current_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          echo "Commit verificato: ${EXPECTED_SHA}"
          echo "Checkout:           ${actual_sha}"
          echo "Main corrente:      ${current_main}"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" || "${current_main}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Il commit non coincide con l'attuale main; rilascio interrotto."
            exit 1
          fi

      - name: Configura Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Installa la CLI Firebase
        run: npm install --no-audit --no-fund

      - name: Controlla la configurazione Workload Identity Federation
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$WIF_PROVIDER" || -z "$DEPLOY_SERVICE_ACCOUNT" ]]; then
            echo "::error::Configurare le due repository variables WIF prima del rilascio."
            exit 1
          fi

      - name: Autentica GitHub a Google Cloud senza chiavi JSON
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: piante-a617e
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Pubblica solo il sito piantee sul canale live
        run: npx firebase deploy --only hosting:piantee --project piante-a617e --non-interactive -m "GitHub ${EXPECTED_SHA}"

      - name: Verifica raggiungibilità HTTP dei file pubblici
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 20 https://piantee.web.app/ -o /tmp/piante-home.html
          grep -q 'Piante — Vivaio e catalogo botanico' /tmp/piante-home.html
          curl --fail --location --silent --show-error --retry 3 --max-time 20 --output /dev/null https://piantee.web.app/styles.css
          curl --fail --location --silent --show-error --retry 3 --max-time 20 --output /dev/null https://piantee.web.app/src/main.js
          grep -q 'property="og:image"' /tmp/piante-home.html
          curl --fail --location --silent --show-error --retry 3 --max-time 20 https://piantee.web.app/favicon.svg -o /tmp/piante-favicon.svg
          grep -q '<svg' /tmp/piante-favicon.svg
          curl --fail --location --silent --show-error --retry 3 --max-time 20 https://piantee.web.app/favicon.ico -o /tmp/piante-favicon.ico
          test "$(head -c 4 /tmp/piante-favicon.ico | od -An -tx1 | tr -d ' \n')" = "00000100"
          curl --fail --location --silent --show-error --retry 3 --max-time 20 https://piantee.web.app/social-preview-v1.png -o /tmp/piante-social.png
          test "$(head -c 8 /tmp/piante-social.png | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a"
