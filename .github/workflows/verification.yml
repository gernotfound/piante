name: Website verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-and-unit:
    name: Static & unit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check browser modules syntax
        run: |
          for module in web/firebase-config.mjs web/scripts/*.mjs; do node --check "$module"; done
      - name: Validate static Hosting and tests
        run: npm run verify
      - name: Guard no accidental Firebase deploy
        run: |
          test ! -e .firebaserc.local
          test ! -e web/sw.js

  firestore-emulator:
    name: Firestore Rules Emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned test-only SDKs
        run: npm install --no-save --no-package-lock firebase@12.19.0 @firebase/rules-unit-testing@5.0.2 firebase-tools@15.30.1
      - name: Test real Firestore Rules against emulator
        run: npx --no-install firebase emulators:exec --config firebase.emulator.json --project demo-piante-rules --only firestore "node --test tests/emulator.test.mjs"

  browser-responsive:
    name: Responsive browser smoke
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: npm install --no-save --no-package-lock playwright@1.62.1
      - name: Check responsive layout in Chromium
        run: node --test tests/browser.test.mjs
